<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STRAY Live · Lake Tour Edition</title>
<meta name="description" content="Follow the STRAY Lake Tour Edition live: where the runners are, when they reach each aid station, where you can join, and what is pledged so far.">
<meta name="theme-color" content="#2e2452">
<meta property="og:title" content="STRAY Live · Lake Tour Edition">
<meta property="og:description" content="Follow the runners around Lac Léman. 28–29 November 2026.">
<link rel="icon" href="../assets/stray-ink.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
/* STRAY Live. Same tokens, fonts and ruled look as the STRAY sites. Spacing steps: 4 · 8 · 12 · 16 · 24. */
@font-face{font-family:"Stencil";src:url(../assets/fonts/stick-no-bills-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Stencil";src:url(../assets/fonts/stick-no-bills-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Archivo V";src:url(../assets/fonts/archivo-latin-standard-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --ink:#2e2452;--ink-2:#5b4f86;--line:#2e2452;--soft:#2e245226;--paper:#f6efe9;--paper-2:#ece3db;
  --ok:#2f7a4f;--warn:#b86a12;--bad:#a3243b;
  --land:#f6efe9;--lake:#d9d0e8;--decor:#2e245266;--sky:#f6efe9;--mtn:#d9d0e8;--mtn2:#ece3db;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --st:"Stencil","Arial Narrow",Impact,sans-serif;--f-body:"Archivo V",Helvetica,Arial,sans-serif;--f-mono:"Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html.night{--ink:#f6efe9;--ink-2:#cfc4e2;--line:#f6efe9;--soft:#f6efe92e;--paper:#1b1534;--paper-2:#2a2150;--ok:#6fd39a;--warn:#ffb65c;--bad:#ff7a90;
  --land:#1b1534;--lake:#2c2260;--decor:#f6efe959;--sky:#120d26;--mtn:#2c2260;--mtn2:#221a47;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;height:100vh;height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.4}
svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:0 16px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);height:calc(60px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;min-width:0}
.brand img{display:block;height:32px;width:auto}
.brand .lg-night,html.night .brand .lg-day{display:none}
html.night .brand .lg-night{display:block}
.brand .ttl{display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:1px solid var(--soft)}
.brand .ttl b{font-family:var(--st);font-weight:400;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.top .sp{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:118px}
.clock b{font-family:var(--st);font-weight:400;font-size:28px;line-height:.92;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:0 12px;height:32px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.chip.live i{background:var(--bad);animation:blink 1.6s infinite}
.chip.demo{border-style:dashed}
@keyframes blink{50%{opacity:.25}}
.tbtn{border:1px solid var(--line);padding:0 12px;height:32px}
.tbtn:hover{background:var(--paper-2)}
.prog{position:absolute;left:0;top:0;height:3px;background:var(--ok);z-index:900;width:0;transition:width 1s linear}

/* ---------- map ---------- */
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--land)}
.mapwrap:not(.flat) #map{top:128px}
.maplibregl-canvas{outline:none}
.maplibregl-map{font:inherit}
/* horizon */
.pano{position:absolute;z-index:500;left:0;right:0;top:0;height:128px;background:var(--sky);border-bottom:1.5px solid var(--line);overflow:hidden;pointer-events:none}
.flat .pano{display:none}
.pano svg{position:absolute;inset:0;width:100%;height:100%}
.pano .far{fill:var(--mtn);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.pano .snow{fill:var(--paper);stroke:var(--ink);stroke-width:.7;stroke-linejoin:round}
.pano .near{fill:var(--mtn2);stroke:var(--ink);stroke-width:1;stroke-opacity:.5;stroke-linejoin:round}
.pano .lbls span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap;text-transform:uppercase}
.pano .lbls b{font-weight:500;color:var(--ink)}
.pano .sky i{position:absolute;font-style:normal;font-family:var(--emoji);line-height:1}
.pano .sun{left:4%;top:8px;font-size:22px}
.pano .cl{font-size:22px;opacity:.85;left:100%;animation:drift 120s linear infinite}
.pano .cl.b{top:30px;font-size:16px;animation-duration:170s;animation-delay:-60s}
.pano .cl.c{top:6px;font-size:18px;animation-duration:210s;animation-delay:-140s}
.pano .cl.a{top:14px;animation-delay:-20s}
@keyframes drift{to{transform:translateX(calc(-100vw - 60px))}}
/* controls */
.ctl{position:absolute;z-index:800;right:16px;top:16px;display:flex;flex-direction:column;gap:8px}
.mapwrap:not(.flat) .ctl,.mapwrap:not(.flat) .now{top:144px}
.ctl div{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper)}
.ctl button{width:36px;height:36px;display:grid;place-items:center;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:17px;line-height:1}
.ctl button:first-child{border-top:0}
.ctl button:hover{background:var(--paper-2)}
.ctl svg{width:16px;height:16px}
.ctl #cView{font-size:11px;letter-spacing:.06em;font-weight:500}

/* decoration */
.dc{width:0;height:0;overflow:visible;pointer-events:none!important;color:var(--decor)}
.dc.em i{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-style:normal;font-family:var(--emoji);font-size:19px;line-height:1;animation:bob 3.4s ease-in-out infinite}
.dc.ferry i{font-size:26px;animation-duration:2.6s}
@keyframes bob{50%{margin-top:-4px;rotate:5deg}}
.z-info .dc.em:not(.ferry){display:none}
.dc span{position:absolute;transform:translate(-50%,-50%);font-family:var(--st);text-transform:uppercase;white-space:nowrap;letter-spacing:.5em;font-size:15px}
.dc.big span{font-size:26px;letter-spacing:.42em}
.z-street .dc,.z-far .dc:not(.big):not(.ferry){display:none}
.kmk{width:0;height:0;overflow:visible;pointer-events:none!important}
.kmk span{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;background:var(--land);color:var(--ink-2);padding:1px 4px;border:1px solid var(--soft);white-space:nowrap}
#map:not(.z-lbl) .kmk{display:none}

/* markers: zero-size anchor, children centred on it */
.mk,.poi,.van,.pk{width:0;height:0;overflow:visible;cursor:pointer}
.mk .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.mk.big .dot{background:var(--ink)}
.mk.se .dot{left:-9px;top:-9px;width:18px;height:18px;background:var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink)}
.mk.join .dot{border-radius:0;transform:rotate(45deg);left:-6px;top:-6px;width:12px;height:12px;background:var(--bad);border-color:var(--paper)}
.hit{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%}
.mk .tag{position:absolute;top:-12px;left:14px;display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;background:var(--paper);border:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;white-space:nowrap;cursor:pointer}
.mk.l .tag{left:auto;right:14px}
.mk .tag b{font-family:var(--st);font-weight:400;font-size:15px;letter-spacing:.03em}
.mk .tag .xt{display:none;color:var(--ink-2);padding-left:6px;border-left:1px solid var(--soft)}
.z-info .mk .tag .xt{display:inline}
.mk.next .tag .xt{color:inherit;border-color:currentColor}
.mk.join .tag{border-color:var(--bad);color:var(--bad)}
.mk.past .dot{opacity:.45}.mk.past .tag{opacity:.5}
.mk.next .tag{background:var(--ink);color:var(--paper)}
.sel .tag,.sel .lbl{outline:2px solid var(--ink);outline-offset:1px}
.hide{display:none!important}

.poi .ic{position:absolute;left:-16px;top:-16px;width:32px;height:32px;display:grid;place-items:center;font-style:normal;font-family:var(--emoji);font-size:18px;line-height:1;background:var(--paper);border:1px solid var(--line);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.poi:hover .ic,.poi.sel .ic{transform:scale(1.22) rotate(-5deg)}
.poi.yes .ic{background:var(--ink);color:var(--paper)}
.poi .lbl{position:absolute;top:-16px;left:20px;display:none;flex-direction:column;justify-content:center;min-height:32px;padding:3px 8px;background:var(--paper);border:1px solid var(--soft);white-space:nowrap;cursor:pointer}
.poi.l .lbl{left:auto;right:20px;text-align:right}
.poi .lbl b{font-size:12px;font-weight:600;line-height:1.25}
.poi .lbl em{display:none;font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-2);line-height:1.35}
.poi.yes .lbl em{color:var(--ok)}
.z-lbl .poi .lbl{display:flex}
.z-info .poi .lbl em{display:block}

.van .box{position:absolute;left:-19px;top:-16px;width:38px;height:32px;display:grid;place-items:center;font-style:normal;font-family:var(--emoji);font-size:21px;line-height:1;background:var(--paper);border:2px solid var(--ink);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.van:hover .box{transform:scale(1.15) rotate(-4deg)}
.van .nm{position:absolute;top:20px;left:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:1px 5px;white-space:nowrap}
.van.stale .box{opacity:.55}


.pk .stack{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;cursor:pointer}
.pk .av{width:44px;height:44px;border-radius:50%;background:var(--paper-2) center/cover;border:2px solid var(--paper);box-shadow:0 0 0 2px var(--bad);margin-left:-14px;flex:none}
.pk .av:first-child{margin-left:0}
.pk .more{margin-left:-10px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--bad);color:#fff;font-family:var(--st);font-size:16px;display:grid;place-items:center;border:2px solid var(--paper);flex:none}
html.night .pk .more,html.night .pk .cap{color:#1b1534}
.pk.plan .av{box-shadow:0 0 0 2px var(--ink-2)}
.pk.plan .more,.pk.plan .cap{background:var(--ink-2)}
.pk .ring{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:2px solid var(--bad);animation:ring 2.2s ease-out infinite;pointer-events:none}
.pk.plan .ring{display:none}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.pk .cap{position:absolute;top:30px;left:0;transform:translateX(-50%);background:var(--bad);color:#fff;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pk .ring,.chip.live i{animation:none}}

/* layer switches */
.no-st .mk.st,.no-join .mk.join,.no-poi .poi,.no-van .van{display:none}

/* ---------- overlays on the map ---------- */
.now{position:absolute;z-index:800;left:16px;top:16px;width:336px;background:var(--paper);border:1px solid var(--line);padding:16px}
.now .h{font-family:var(--st);font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:8px 0}
.now p{margin:0;font-size:14px;line-height:1.4}
.now .delta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.now .delta.late{color:var(--warn)}.now .delta.early{color:var(--ok)}
.now .joinnext{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding-top:12px;border-top:1px solid var(--soft)}
.now .joinnext b{font-weight:600;display:block;margin-top:2px}
.now .joinnext:hover b{text-decoration:underline}
.now .joinnext>span:last-child{font-family:var(--st);font-size:20px;white-space:nowrap}

.legend{position:absolute;z-index:800;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.legend .sw{display:flex;border:1px solid var(--line);background:var(--paper)}
.legend button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-left:1px solid var(--line);white-space:nowrap}
.legend button:first-child{border-left:0}
.legend button[aria-pressed="false"]{color:var(--ink-2);text-decoration:line-through;background:var(--paper-2)}
.legend button i{width:10px;height:10px;border:2px solid currentColor;border-radius:50%;flex:none}
.legend button i.j{border-radius:0;transform:rotate(45deg) scale(.8);background:var(--bad);border-color:var(--bad)}
.legend button i.p{border-radius:0;border-width:1px}
.legend button i.v{border-radius:0;background:currentColor;width:13px;height:9px}
.legend .hint{background:var(--paper);border:1px solid var(--soft);height:32px;display:flex;align-items:center;padding:0 10px;color:var(--ink-2);white-space:nowrap}

.raise{position:absolute;z-index:800;right:16px;bottom:16px;display:flex;align-items:stretch;background:var(--paper);border:1px solid var(--line);text-align:left}
.raise:hover{background:var(--paper-2)}
.raise .t{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px 16px 12px 12px}
.raise .t b{font-family:var(--st);font-weight:400;font-size:34px;line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.raise .t u{text-decoration:none;font-size:13px;font-weight:500;border-bottom:1px solid currentColor;align-self:flex-start}
.qr{background:#f6efe9;color:#2e2452;padding:8px;display:block;line-height:0}
.raise .qr{width:96px;height:96px;border-left:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}

/* ---------- runners dock ---------- */
.dock{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:8px 16px;height:64px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:20px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 0;border:1px solid var(--soft);height:48px;text-align:left}
.strip button:hover{border-color:var(--line)}
.strip img{width:46px;height:46px;object-fit:cover;display:block}
.strip span{font-size:13px;font-weight:500;white-space:nowrap;line-height:1.25}
.strip small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.strip .vn{padding:0 12px}
.strip .vn .vi{font-style:normal;font-family:var(--emoji);font-size:22px;line-height:1;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:500;border:1px solid var(--ink);white-space:nowrap;flex:none}
.btn:hover{opacity:.9}
.btn.ghost{background:none;color:var(--ink)}
.btn.ghost:hover{background:var(--paper-2);opacity:1}
.btn.two{flex-direction:column;gap:0;align-items:flex-start;line-height:1.2}
.btn.two small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;opacity:.85}

/* ---------- partners band: one moving line, main partners larger ---------- */
.partners{border-top:1px solid var(--line);height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
.marq{height:100%;overflow:hidden}
.track{display:flex;align-items:center;gap:44px;height:100%;width:max-content;animation:marq 80s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.lg{display:block;flex:none;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;height:22px;opacity:.9}
.lg img{display:block;height:100%;width:auto;opacity:0}
.partners a{display:block;flex:none}
.partners a:hover .lg{opacity:.6}
.partners .pm{display:flex;align-items:center;gap:16px;height:100%;padding:0 24px;background:var(--ink);color:var(--paper)}
.partners .pm .mono{white-space:nowrap;opacity:.8}
.partners .pm .lg{height:32px;opacity:1}
@media (prefers-reduced-motion:reduce){.track{animation-duration:240s}}

/* ---------- panel ---------- */
.panel{position:absolute;z-index:1100;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s cubic-bezier(.7,0,.15,1);visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .x{width:36px;height:36px;border:1px solid var(--line);font-family:var(--f-mono);font-size:15px}
.panel .x:hover{background:var(--paper-2)}
.panel .pb{overflow-y:auto;padding:16px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.panel h2{font-family:var(--st);font-weight:400;font-size:40px;line-height:.92;text-transform:uppercase;letter-spacing:.01em;margin:0 0 8px}
.panel h3{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:24px 0 8px}
.panel p{margin:0 0 12px}
.panel .sub{font-size:16px;margin:0 0 16px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:16px 0}
.figs.two{grid-template-columns:repeat(2,1fr)}.figs.one{grid-template-columns:1fr}
.figs div{padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.figs div:first-child{border-left:0}
.figs b{font-family:var(--st);font-weight:400;font-size:28px;line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-2)}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--soft)}
.rows li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.rows li span:first-child{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding-top:2px;flex:none}
.rows li span:last-child{text-align:right}
.state{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;margin-bottom:12px}
.state.on{background:var(--ink);color:var(--paper)}
.state.ok{border-color:var(--ok);color:var(--ok)}
.callout{border:1px solid var(--bad);padding:12px;margin:16px 0}
.callout b{display:block;font-family:var(--st);font-weight:400;font-size:22px;line-height:1;text-transform:uppercase;color:var(--bad);margin-bottom:8px}
.callout p{margin:0 0 4px}.callout p:last-child{margin:0}
.note{font-size:13px;color:var(--ink-2);margin:12px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 25%;display:block;border:1px solid var(--line);margin-bottom:16px;background:var(--paper-2)}
.plist{margin:0;padding:0;list-style:none}
.plist button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--soft)}
.plist button:hover b{text-decoration:underline}
.plist img,.plist .vi{width:52px;height:52px;object-fit:cover;flex:none}
.plist .vi{display:grid;place-items:center;font-style:normal;font-family:var(--emoji);font-size:26px;line-height:1;border:1px solid var(--soft)}
.plist b{display:block;font-weight:600}

.board{margin:0;padding:0;list-style:none;border-top:1px solid var(--soft);counter-reset:n}
.board li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px;counter-increment:n}
.board li::before{content:counter(n,decimal-leading-zero);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.board li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li b{font-family:var(--st);font-weight:400;font-size:18px;letter-spacing:.02em;white-space:nowrap}

.pledgeqr p{margin:0;font-size:13px}
.panel iframe{width:100%;height:100%;border:0;display:block}

/* ---------- phone ---------- */
@media (max-width:1000px){.raise{display:none}}
@media (max-width:720px){
  .top{gap:8px;padding-left:12px;padding-right:12px;height:calc(52px + env(safe-area-inset-top))}
  .brand .ttl{display:none}.brand img{height:26px}

<header class="top">

  <div class="ctl" id="ctl">

    <div><button type="button" id="cFit" title="Whole lake" aria-label="Show the whole lake"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button><button type="button" id="cFind" title="Find the runners" aria-label="Go to the runners"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 0v3M8 13v3M0 8h3M13 8h3"/></svg></button></div>
    <div><button type="button" id="cView" title="Flat map, north up">2D</button></div>

<script>
/* =====================================================================
   CONFIG — the block to edit. Places along the route are in places.js.
   Schedule, stations, join points and route are NOT here: they come from
   ../assets/js/race.js, shared with the race-ops site.
   ===================================================================== */
const CONFIG = {
  // Live positions (runners and vans). URL that returns JSON positions (see backend/Tracker.gs).
  // Empty = the map shows the planned position from the schedule.
  feedUrl: '',
  pollSec: 20,          // how often to ask the feed
  staleMin: 12,         // no signal for this long = "last seen"
  site: 'https://dgompe.github.io/charity-ultra/',
  photos: 'https://dgompe.github.io/charity-ultra/assets/runners/',
  // Pledges: the same Google Sheet backend as the main site. Read-only, totals only.
  pledgeEndpoint: 'https://script.google.com/macros/s/AKfycbwV4ssz_plzEkojwrkFqi7vxsZlgv6p8beLgqzianswYfF0MURM2fPfeE6L4UvyWbiB/exec',
  pledgeUrl: 'https://dgompe.github.io/charity-ultra/#pledge-form',   // the QR code points here
  streets: true,        // show street detail when zoomed in close
  // tracker: the id, bib or device name the tracker provider uses. Empty = match by name.
  runners: [
    { name: 'David Gomez Pereda', img: 'david-gomez-pereda.jpg', tracker: '', bio: 'Grew up between Spain and the US. Doctor. Obese as a kid, more at home with paint than a ball. Sport got me out, and into hard things.' },
    { name: 'Michele Gaeta', img: 'michele-gaeta.jpg', tracker: '', bio: 'Sport has always been part of my life, and it has shaped who I am and how I face challenges. I started cycling at 14 and spent years racing.' },
    { name: 'Francis Pfluger', img: 'francis-pfluger.jpg', tracker: '', bio: 'I’ve always been drawn to adventure and love to compete. Being a father, husband, son, friend, employee and so on, running, especially in the mountains, still gives me a chance to do both. Today I mostly compete with my younger self, but I like that it keeps me in shape so I can keep up with my kids.' },
    { name: 'Clarinde Esculier', img: 'clarinde-esculier.jpg', tracker: '', bio: 'I grew up across three continents and trained as a doctor. Wherever life has taken me, the mountains and nature have been a place where I find peace and reconnect with myself.' },
    { name: 'Arthur Wong', img: 'arthur-wong.jpg', tracker: '', bio: 'I used to run to get more in touch with myself. Listening, having conversations between the heart, the body and the mind: a status check, a detox, a fitness enhancement. One runs quick, but time slows down. I still do that today.' },
    { name: 'Marthinus Erasmus', img: 'marthinus-erasmus.jpg', tracker: '', bio: 'This year I signed up for the Stray 100, a 100-mile race around Lake Geneva. I always knew a 100-miler in one go was in my future. I just didn’t expect it to be this year, because twelve months ago I couldn’t run at all.' },
    { name: 'Angela Gisler', img: 'angela-gisler-2.jpg', tracker: '', bio: 'Running offers me resonance in many different ways: sometimes the opportunity to push my limits, sometimes peace and recovery.' },
    { name: 'Vincent Leroy', img: 'vincent-leroy-4k.jpg', tracker: '', bio: 'Nine years in Switzerland, here for the mountains and the challenge. I see the lake every day. Now I want to run around it.' },
  ],
  vehicles: [
    { name: 'Sprinter', emoji: '🚐', tracker: '', role: 'Race van' },
    { name: 'Van A', emoji: '🚐', tracker: '', role: 'Support van' },
    { name: 'Van B', emoji: '🚐', tracker: '', role: 'Support van' },
  ],
  mainPartners: [
    { name: 'Mount to Coast', logo: 'mount-to-coast', url: 'https://ch.mounttocoast.com/' },
    { name: 'IMD', logo: 'imd', url: 'https://www.imd.org/' },
  ],
  supporters: [
    ['COROS', 'coros', 'https://coros.com'], ['SEMS', 'sems', 'https://sems.ch'], ['PEAQ', 'peaq', 'https://peaqhydration.com'],
    ['Compressport', 'compressport', 'https://compressport.com'], ['Vitamin Well', 'vitamin-well', 'https://vitaminwell.com'],
    ['S-Rehab', 's-rehab', 'https://s-rehab.ch'], ['LEKI', 'leki', 'https://leki.com'], ['Poltrax', 'poltrax', 'https://poltrax.live/en'],
    ['HydraPak', 'hydrapak', 'https://hydrapak.com'], ['CGN', 'cgn', 'https://cgn.ch'], ['YETI', 'yeti', 'https://yeti.com'],
    ['Lime', 'lime', 'https://li.me'], ['Compex', 'compex', 'https://compex.com'], ['Condecta', 'condecta', 'https://condecta.ch'],
    ['New Roots', 'new-roots', 'https://newroots.ch'], ['Patagonia', 'patagonia', 'https://eu.patagonia.com/ch/'],
    ['Leukotape', 'leukotape', 'https://leukotape.com/ch/de/produkte'], ['Europcar', 'europcar', 'https://europcar.ch'], ['Maysun', 'maysun', ''],
  ],
  // Public points on the last section, in km before the finish. A13 (St-Sulpice) is the last-5-km point already.
  lastKm: [2, 1],
  sunset: '16:50', sunrise: '07:55',
};

(() => {
'use strict';
const R = window.RACE, ST = R.stations, FIN = ST[ST.length - 1], P = R.route;
const $ = s => document.querySelector(s);
const OFF = 3600e3, MIN = 60e3, DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pad = n => String(n).padStart(2, '0');
const hm = ms => { const d = new Date(ms + OFF); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const day = ms => DAYS[new Date(ms + OFF).getUTCDay()];
const fmt = ms => day(ms) + ' ' + hm(ms);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = ms => { const m = Math.max(0, Math.round(ms / MIN)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60); };
const place = s => s.id === 'START' || s.id === 'FIN' ? 'IMD' : s.id;
const chf = n => 'CHF ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '’');

/* ---------- clock (real, ?t=… frozen, or ?demo fast-forward) ---------- */
const Q = new URLSearchParams(location.search);
const DEMO = Q.has('demo');
const T0 = Q.get('t') ? Date.parse(Q.get('t').length <= 16 ? Q.get('t') + ':00+01:00' : Q.get('t')) : null;
const BOOT = Date.now(), SPEED = Number(Q.get('speed')) || 400;
const now = () => DEMO ? R.start - 20 * MIN + (Date.now() - BOOT) * SPEED : (T0 || Date.now());

/* ---------- plan maths (same rules as the race-ops site) ---------- */
function planAt(t) {
  if (t < R.start) return { state: 'pre', km: 0 };
  if (t >= FIN.arr) return { state: 'done', km: R.routeKm };
  for (let i = 0; i < ST.length - 1; i++) {
    const a = ST[i], b = ST[i + 1];
    if (a.arr && t >= a.arr && t < a.dep) return { state: 'stop', st: a, km: a.km, next: b, i };
    if (t >= a.dep && t < b.arr) return { state: 'run', from: a, to: b, i, sec: 'S' + (i + 1), km: a.km + (t - a.dep) / (b.arr - a.dep) * (b.km - a.km) };
  }
  return { state: 'done', km: R.routeKm };
}
function timeAtKm(k) { // when the plan passes km k
  for (let i = 0; i < ST.length - 1; i++) { const a = ST[i], b = ST[i + 1]; if (k <= b.km) return a.dep + (k - a.km) / (b.km - a.km) * (b.arr - a.dep); }
  return FIN.arr;
}
function pointAtKm(k) {
  if (k <= 0) return P[0].slice(0, 2); if (k >= P[P.length - 1][3]) return P[P.length - 1].slice(0, 2);
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][3] <= k) lo = m; else hi = m; }
  const a = P[lo], b = P[hi], f = (k - a[3]) / ((b[3] - a[3]) || 1);
  return [a[0] + f * (b[0] - a[0]), a[1] + f * (b[1] - a[1])];
}
const COS = Math.cos(46.4 * Math.PI / 180);
const metres = (la1, lo1, la2, lo2) => Math.hypot((la1 - la2) * 111320, (lo1 - lo2) * 111320 * COS);
function kmOf(lat, lon, hint) { // GPS fix -> km on the route. hint settles the spots the route passes twice.
  let best = 0, bs = Infinity;
  for (let i = 0; i < P.length; i++) { const s = metres(lat, lon, P[i][0], P[i][1]) + Math.abs(P[i][3] - hint) * 20; if (s < bs) { bs = s; best = i; } }
  let km = P[best][3];
  [[best - 1, best], [best, best + 1]].forEach(([i, j]) => {
    if (i < 0 || j >= P.length) return; const a = P[i], b = P[j];
    const ax = (lon - a[1]) * COS, ay = lat - a[0], bx = (b[1] - a[1]) * COS, by = b[0] - a[0], L = bx * bx + by * by; if (!L) return;
    const f = (ax * bx + ay * by) / L; if (f > 0 && f < 1) km = a[3] + f * (b[3] - a[3]);
  });
  return { km, off: metres(lat, lon, P[best][0], P[best][1]) };
}
const hmToMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const SUNSET = hmToMin(CONFIG.sunset), SUNRISE = hmToMin(CONFIG.sunrise);
const isDark = ms => { const d = new Date(ms + OFF), m = d.getUTCHours() * 60 + d.getUTCMinutes(); return m >= SUNSET || m < SUNRISE; };
const light = (a, b) => isDark(a) && isDark(b) ? 'Dark' : !isDark(a) && !isDark(b) ? 'Daylight' : 'Partly dark';

/* ---------- points on the map ---------- */
const POINTS = [];
ST.forEach((s, i) => {
  if (s.id === 'FIN') return;
  const sub = (s.sub || '').replace(/^Regroup · /, '');
  POINTS.push({ id: s.id, kind: s.id === 'START' ? 'se' : 'st', i, lat: s.lat, lon: s.lon, km: s.km, t: s.arr || s.dep, short: s.id === 'START' ? 'IMD' : s.id, big: s.big, join: s.final ? 'last' : null,
    extra: s.id === 'START' ? 'Start · finish' : [sub, 'dep ' + hm(s.dep)].filter(Boolean).join(' · ') });
});
(R.waypoints || []).filter(w => w.join).forEach(w => POINTS.push({ id: 'J' + Math.round(w.km), kind: 'join', lat: w.lat, lon: w.lon, km: w.km, t: timeAtKm(w.km), short: w.name.replace(/\s*start$/i, ''), name: w.name, join: 'pack', extra: 'join the pack' }));
CONFIG.lastKm.forEach(n => { const km = R.routeKm - n, p = pointAtKm(km); POINTS.push({ id: 'L' + n, kind: 'join', lat: p[0], lon: p[1], km, t: timeAtKm(km), short: 'Last ' + n + ' km', name: 'Last ' + n + ' km', join: 'last', toGo: n, extra: 'run along or follow by bike' }); });
const JOINS = POINTS.filter(p => p.join).sort((a, b) => a.km - b.km);
const PLACES = (window.PLACES || []).map(p => { const k = kmOf(p.lat, p.lon, p.km); return { ...p, kind: 'poi', rkm: k.km, t: timeAtKm(k.km) }; });

/* ---------- map: a tilted panorama of the lake, Alps on the horizon ---------- */
const mapEl = $('#map'), wrap = $('.mapwrap');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const lats = P.map(p => p[0]), lons = P.map(p => p[1]);
const BOX = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
const MID = [(BOX[0][0] + BOX[1][0]) / 2, (BOX[0][1] + BOX[1][1]) / 2];
const PHONE = () => innerWidth <= 720;
const CALM = matchMedia('(prefers-reduced-motion:reduce)').matches;
const VIEWS = { pano: { bearing: 132, pitch: 54 }, flat: { bearing: 0, pitch: 0 } };
let MODE = Q.get('view') === 'flat' ? 'flat' : 'pano';
const G = ll => [ll[1], ll[0]];
const Z = () => map.getZoom() + 1; // zoom on the usual web-map scale, used by places.js
let READY = false;

if (!(() => { try { const c = document.createElement('canvas'); return c.getContext('webgl2') || c.getContext('webgl'); } catch { return null; } })()) mapEl.innerHTML = '<p style="padding:160px 24px 24px;max-width:420px">This map needs WebGL. Open the page in an up-to-date browser. The schedule is on the race info page.</p>';
const map = new maplibregl.Map({ container: 'map', attributionControl: false, fadeDuration: 0, minZoom: 6.5, maxZoom: 16.5, maxPitch: 66,
  center: MID, zoom: 7.2, pitch: 0, bearing: 0,
  style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': css('--land') } }] } });
map.touchZoomRotate.enable(); map.keyboard.enable();
if (Q.has('debug')) window._map = map;

function fitPad() {
  const nowEl = $('#now');
  return PHONE() ? { top: nowEl.offsetTop + nowEl.offsetHeight - mapEl.offsetTop + 34, left: 56, right: 56, bottom: 74 } : { top: 60, left: innerWidth > 1100 ? 384 : 60, right: 84, bottom: 100 };
}
let FIT = false;
function camFor() { // the camera that puts the whole loop inside the free part of the screen, tilt included
  const v = VIEWS[MODE], pad = fitPad(), W = mapEl.clientWidth, H = mapEl.clientHeight;
  const keep = { center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() };
  FIT = true; map.stop(); map.jumpTo({ center: MID, zoom: 9, bearing: v.bearing, pitch: v.pitch });
  for (let n = 0; n < 7; n++) {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let i = 0; i < LL.length; i += 3) { const q = map.project(LL[i]); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    const k = Math.min((W - pad.left - pad.right) / (x1 - x0), (H - pad.top - pad.bottom) / (y1 - y0));
    const c = map.unproject([W / 2 + (x0 + x1) / 2 - (pad.left + W - pad.right) / 2, H / 2 + (y0 + y1) / 2 - (pad.top + H - pad.bottom) / 2]);
    map.jumpTo({ center: c, zoom: map.getZoom() + Math.log2(k) * .85 });
  }
  const out = { center: map.getCenter(), zoom: map.getZoom(), bearing: v.bearing, pitch: v.pitch };
  map.jumpTo(keep); FIT = false; return out;
}
function fitAll(ms = 1400) { wrap.classList.toggle('flat', MODE === 'flat'); map.resize(); const c = camFor(); if (ms && !CALM) map.flyTo({ ...c, duration: ms, essential: true }); else { map.jumpTo(c); } }

  const key = map.getZoom().toFixed(2) + (swaying ? '' : map.getBearing().toFixed(0) + map.getPitch().toFixed(0)) + plan.state + RUN.map(r => r.src + (r.stale ? 's' : '') + (r.ll ? r.ll[0].toFixed(5) + r.ll[1].toFixed(5) : '')).join();

  pts.sort((a, b) => b.r.km - a.r.km).forEach(o => { const g = PACK.find(g => Math.hypot(g.px.x - o.px.x, g.px.y - o.px.y) < 48 && g.src === o.r.src); if (g) g.rs.push(o.r); else PACK.push({ px: o.px, ll: o.r.ll, src: o.r.src, rs: [o.r] }); });

    const show = g.rs.slice(0, g.rs.length > 3 ? 2 : 3), more = g.rs.length - show.length;
    const cap = g.src === 'plan' ? (plan.state === 'pre' ? 'Start ' + fmt(R.start) : plan.state === 'done' ? 'Finished' : 'By schedule') : g.rs.every(r => r.stale) ? 'Last seen ' + hm(Math.max(...g.rs.map(r => r.ts))) : '';
    const m = mark(g.ll[0], g.ll[1], 'pk ' + g.src, `<i class="ring"></i><span class="stack">${show.map(r => `<i class="av" style="background-image:url(${r.thumb})"></i>`).join('')}${more > 0 ? `<i class="more">+${more}</i>` : ''}</span>${cap ? `<span class="cap">${cap}</span>` : ''}`, 100, g.rs.map(r => r.name).join(', '));
    tap(m, () => g.rs.length === 1 ? openRunner(g.rs[0]) : openList(g.rs, g.src === 'plan' ? 'The pack' : 'Runners here'));

}
function drawVans() {
  const key = VAN.map(v => (v.ll ? v.ll[0].toFixed(5) + v.ll[1].toFixed(5) : '-') + (v.stale ? 's' : '')).join(); if (key === vanKey) return; vanKey = key;

}
function vanLine(v) {

  return (near.d < 400 ? 'At ' + place(near.s) : (near.d / 1000).toFixed(1) + ' km from ' + place(near.s)) + (v.ts ? ' · ' + (v.stale ? 'last seen ' : 'signal ') + hm(v.ts) : '');
}

function nowCard(t, plan, nextSt) {
  const E = $('#nowE'), H = $('#nowH'), Pp = $('#nowP'), D = $('#nowD'), ck = $('#ck'), ckL = $('#ckL');
  const hms = ms => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
  if (plan.state === 'pre') {
    const ms = R.start - t, d = Math.floor(ms / 864e5);
    ckL.textContent = 'Start in'; ck.textContent = (d ? d + 'd ' : '') + hms(ms % 864e5);
    E.textContent = 'Before the start'; H.textContent = 'Sat 28.11 · 11:00'; Pp.textContent = 'Start and finish at IMD, Lausanne. ' + R.routeKm.toFixed(1) + ' km around Lac Léman. Tap a point for times.';
  } else if (plan.state === 'done') {
    ckL.textContent = 'Finished'; ck.textContent = hms(FIN.arr - R.start);
    E.textContent = 'Finished'; H.textContent = 'Back at IMD'; Pp.textContent = 'The pack closed the loop on Sunday at ' + hm(FIN.arr) + '. Thank you for following.';
  } else {
    ckL.textContent = 'Race clock'; ck.textContent = hms(t - R.start);
    const km = PACKKM, i = Math.max(0, ST.findIndex(s => s.km > km + .05) - 1), a = ST[i], b = ST[i + 1] || FIN;
    const atStop = !LIVE ? plan.state === 'stop' : Math.abs(a.km - km) < .25 && a.dep && t < a.dep + 5 * MIN;
    E.textContent = LIVE ? 'Now · live' : 'Now · by schedule';
    if (atStop) { const s = LIVE ? a : plan.st; H.textContent = 'At ' + place(s) + (s.sub ? ' · ' + s.sub.replace(/^Regroup · /, '') : ''); Pp.textContent = 'Aid stop. Departs ' + hm(s.dep) + '. Km ' + s.km.toFixed(1) + ' of ' + R.routeKm.toFixed(1) + '.'; }
    else { const eta = nextSt.arr + (DELTA != null && Math.abs(DELTA) >= 3 ? DELTA * MIN : 0); H.textContent = 'S' + (i + 1) + ' · ' + place(a) + ' → ' + place(b); Pp.textContent = 'Km ' + km.toFixed(1) + ' of ' + R.routeKm.toFixed(1) + '. Next: ' + place(b) + ' at ' + (eta !== nextSt.arr ? 'about ' : '') + hm(eta) + ', in ' + dur(eta - t) + '.'; }
  }
  const showD = DELTA != null && plan.state !== 'pre' && plan.state !== 'done';
  D.hidden = !showD;
  if (showD) { D.className = 'delta ' + (DELTA >= 3 ? 'late' : DELTA <= -3 ? 'early' : ''); D.textContent = Math.abs(DELTA) < 3 ? 'On schedule' : Math.abs(DELTA) + ' min ' + (DELTA > 0 ? 'behind' : 'ahead of') + ' schedule'; }
  const j = plan.state === 'done' ? null : JOINS.find(p => p.t > t && p.km > (plan.state === 'pre' ? -1 : PACKKM));
  $('#joinNext').hidden = !j;
  if (j) { $('#jnT').textContent = joinName(j); $('#jnW').textContent = fmt(j.id === 'A13' ? ST[j.i].dep : j.t); $('#joinNext').onclick = () => openPoint(j); }
}
const joinName = p => p.id === 'A13' ? 'Last 5 km · St-Sulpice' : p.name;

let stripKey = '';
function strip(plan) {
  const key = RUN.map(r => r.src + (r.stale ? 's' : '') + r.km.toFixed(1)).join('|') + plan.state + VAN.map(v => vanLine(v)).join('|'); if (key === stripKey) return; stripKey = key;
  const el = $('#strip');
  if (!el.children.length) {
    el.innerHTML = RUN.map(r => `<button type="button" data-r="${r.i}" aria-label="${esc(r.name)}"><img src="${r.thumb}" alt="" loading="lazy" width="46" height="46"><span>${esc(r.first)}<small></small></span></button>`).join('') +
      VAN.map(v => `<button type="button" class="vn" data-v="${v.i}" aria-label="${esc(v.name)}"><i class="vi">${v.emoji || '🚐'}</i><span>${esc(v.name)}<small></small></span></button>`).join('');
    el.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.r) { const r = RUN[b.dataset.r]; openRunner(r); if (r.ll) reveal(r.ll); } else { const v = VAN[b.dataset.v]; openVan(v); if (v.ll) reveal(v.ll); } };
  }
  [...el.children].forEach(b => { b.querySelector('small').textContent = b.dataset.r ? runnerLine(RUN[b.dataset.r], plan, true) : (VAN[b.dataset.v].ll ? vanLine(VAN[b.dataset.v]).split(' · ')[0] : 'No signal yet'); });
}
function runnerLine(r, plan, short) {
  if (plan.state === 'pre') return short ? 'Full loop' : 'Runs the full loop. Starts ' + fmt(R.start) + '.';
  if (plan.state === 'done' && r.src !== 'live') return 'Finished';
  if (r.src === 'live') return r.stale ? 'Last seen ' + hm(r.ts) : 'Km ' + r.km.toFixed(1) + (short ? '' : ' · live · signal ' + hm(r.ts));
  return 'Km ' + r.km.toFixed(1) + (short ? '' : ' · with the pack, by schedule');
}

let BOARD = null;
function qrSvg(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); let d = ''; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`; return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code to the pledge form"><path fill="currentColor" d="${d}"/></svg>`; }

}
function openPledge() {

    let h = `<h2>Pledge challenge</h2><p class="sub">Pledge for the loop. Pledges go to the Fondation Planètes Enfants Malades.</p>`;
    if (tot && tot.pledged > 0) h += `<div class="figs ${tot.received > 0 ? 'two' : 'one'}"><div><span class="mono">Pledged so far</span><b>${chf(tot.pledged)}</b><small>live · updates every minute</small></div>${tot.received > 0 ? `<div><span class="mono">Received</span><b>${chf(tot.received)}</b><small>arrived so far</small></div>` : ''}</div>`;

    if (groups.length) h += `<h3>Ranking</h3><ol class="board">${groups.map(g => `<li><span>${esc(g.name)}</span><b>${chf(g.pledged)}</b></li>`).join('')}</ol><div class="acts"><a class="btn ghost" href="${CONFIG.site}#pledge">Full ranking</a></div>`;

$('#pledge').onclick = openPledge; $('#raise').onclick = openPledge;

const logo = (name, file) => `<span class="lg" role="img" aria-label="${esc(name)}" style="--u:url(../assets/logos/${file}.png)"><img src="../assets/logos/${file}.png" alt=""></span>`;
{ const sup = CONFIG.supporters.map(([n, f, u]) => u ? `<a href="${u}" target="_blank" rel="noopener" title="${esc(n)}">${logo(n, f)}</a>` : logo(n, f));
  const main = CONFIG.mainPartners.map(p => `<a class="pm" href="${p.url}" target="_blank" rel="noopener" title="${esc(p.name)}"><span class="mono">Main partner</span>${logo(p.name, p.logo)}</a>`);
  const per = Math.ceil(sup.length / (main.length * 2)); let one = '';
  for (let i = 0, k = 0; i < sup.length; i += per, k++) one += main[k % main.length] + sup.slice(i, i + per).join('');

/* ---------- panel ---------- */
let PANEL = null;
const panel = $('#panel');

  $('#pE').textContent = eyebrow; b.className = 'pb'; b.innerHTML = html; b._html = html;
  if (SEL !== id) { b.scrollTop = 0; b.onclick = null; }
  SEL = id; PANEL = render; panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  [...POINTS, ...PLACES].forEach(p => { const el = p.m.getElement(); if (el) el.classList.toggle('sel', p.id === id); });
  if (/^[A-Za-z0-9]+$/.test(id) && [...POINTS, ...PLACES].some(p => p.id === id)) history.replaceState(null, '', '#' + id);

function close() { if (!SEL) return; $('#pB')._html = null; panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); SEL = null; PANEL = null; [...POINTS, ...PLACES].forEach(p => { const el = p.m.getElement(); if (el) el.classList.remove('sel'); }); history.replaceState(null, '', location.pathname + location.search); zoomState(); declutter(); }
$('#pX').onclick = close;
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
const dirs = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
const welcome = `<p>You are welcome to run along or follow by bike.</p><p>Bring your reflective vest.</p>`;

function status(p, t, plan) {
  if (plan.state === 'pre') return ['Planned', false];
  const ref = p.est || p.t, s = p.kind !== 'join' && p.i != null ? ST[p.i] : null;
  if (s && s.arr && Math.abs(PACKKM - s.km) < .25 && t < s.dep + 5 * MIN && plan.state !== 'done') return ['Pack here now · departs ' + hm(s.dep), true];
  if (plan.state === 'done' || p.km < PACKKM - .05) return ['Passed', false];
  return ['Expected in ' + dur(ref - t), false];
}
const nearby = (km, self) => PLACES.filter(q => q.id !== self && !q.off && Math.abs(q.rkm - km) < 2.5).slice(0, 3);
const nearHtml = list => list.length ? `<h3>Close by</h3><ul class="plist">${list.map(q => `<li><button type="button" data-p="${q.id}"><i class="vi">${q.emoji || '📍'}</i><span><b>${esc(q.name)}</b><small>${esc(q.tag)}</small></span></button></li>`).join('')}</ul>` : '';
const nearClick = () => { $('#pB').onclick = e => { const b = e.target.closest('button[data-p]'); if (b) { const q = PLACES.find(x => x.id === b.dataset.p); openPlace(q); } }; };

function openPoint(p, noPan) {
  const render = () => {
    const t = now(), plan = planAt(t), [stt, on] = status(p, t, plan);
    let h = `<span class="state${on ? ' on' : ''}">${esc(stt)}</span>`;
    if (p.kind === 'join') {
      h += `<h2>${esc(p.name)}</h2><p class="sub">${p.toGo ? 'On the way from St-Sulpice to IMD.' : 'A point where runners join the pack.'}</p>
        <div class="figs"><div><span class="mono">Pack passes</span><b>${hm(p.t)}</b><small>${day(p.t)}</small></div><div><span class="mono">Route km</span><b>${p.km.toFixed(1)}</b></div><div><span class="mono">To finish</span><b>${(R.routeKm - p.km).toFixed(1)}</b><small>km</small></div></div>`;
      h += p.toGo ? `<div class="callout"><b>Join the last ${p.toGo} km</b>${welcome}</div>` : `<div class="callout"><b>Join here</b><p>Be there 10 minutes before the pack passes.</p>${isDark(p.t) ? '<p>It is dark at this time. Reflective vest and headlamp are required.</p>' : '<p>Bring your reflective vest.</p>'}</div>`;

    } else {

      h += start ? `<div class="figs"><div><span class="mono">Start</span><b>${hm(s.dep)}</b><small>Sat 28.11</small></div><div><span class="mono">Finish</span><b>${hm(FIN.arr)}</b><small>Sun 29.11</small></div><div><span class="mono">Loop</span><b>${R.routeKm.toFixed(1)}</b><small>km</small></div></div><p>Come to cheer the start on Saturday and the finish on Sunday. The pack runs the last 5 km together from St-Sulpice.</p>`

      if (prev) h += `<li><span>Section in</span><span>S${p.i} from ${place(prev)} · ${(s.km - prev.km).toFixed(1)} km · ${light(prev.dep, s.arr).toLowerCase()}</span></li>`;
      if (next) h += `<li><span>Section out</span><span>S${p.i + 1} to ${place(next)} · ${(next.km - s.km).toFixed(1)} km · ${light(s.dep, next.arr).toLowerCase()}</span></li>`;
      if (next) h += `<li><span>Next arrival</span><span>${place(next)} at ${fmt(next.arr)}</span></li>`;

$('#allRunners').onclick = () => openList(RUN, 'Runners');

// Poltrax iframe, if that is all the provider gives: set "poltrax" in race.js
if (R.poltrax && /^https:\/\//.test(R.poltrax)) {
  const b = document.createElement('button'); b.className = 'btn ghost'; b.type = 'button'; b.textContent = 'Poltrax map';
  b.onclick = () => { show('Poltrax · live map', '', 'SAT', null); const pb = $('#pB'); pb.className = 'pb frame'; pb.innerHTML = `<iframe src="${esc(R.poltrax)}" title="Live tracking" loading="lazy"></iframe>`; };
  $('#allRunners').before(b);
}

/* ---------- night mode: follows daylight, button overrides ---------- */
let nightPick = null, nightSet = null;
function setNight(on) { nightSet = on; $('#sun').textContent = on ? '🌙' : '☀️'; document.documentElement.classList.toggle('night', on); $('#night').setAttribute('aria-pressed', on); $('#night').textContent = on ? 'Day' : 'Night'; paint(); horizon(); }
$('#night').onclick = () => { nightPick = !document.documentElement.classList.contains('night'); setNight(nightPick); };
function autoNight() { const want = nightPick ?? isDark(now()); if (want !== nightSet) setNight(want); }

/* ---------- run ---------- */
autoNight(); zoomState(); update();
setInterval(() => { autoNight(); update(); }, DEMO ? 500 : 1000);
poll(); setInterval(poll, DEMO ? 500 : CONFIG.pollSec * 1000);
board(); setInterval(board, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); board(); } });

{ const id = location.hash.slice(1), p = id && [...POINTS, ...PLACES].find(x => x.id === id);
  if (p) map.once('load', () => setTimeout(() => p.kind === 'poi' ? openPlace(p) : openPoint(p), CALM || Q.has('t') || DEMO ? 400 : 2600)); }
